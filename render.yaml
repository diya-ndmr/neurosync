services:
  - type: web
    name: neurosync-backend
    runtime: python
    healthCheckPath: /api/ready
    buildCommand: cd backend && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: ALLOW_DEMO_TOKENS
        value: "false"
      - key: MOCK_SSO_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9

# Retain the existing Render databases during the Supabase data migration.
# Remove these resources only after the migrated Supabase data has been verified.
databases:
  - name: neurosync-db
    databaseName: neurosync
    user: neurosync_user
    plan: free
  - name: neurosync-lms-db
    databaseName: neurosync_lms
    user: neurosync_lms_user
    plan: free
