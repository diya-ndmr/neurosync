services:
  # --- Backend Web Service ---
  - type: web
    name: neurosync-backend
    runtime: python
    healthCheckPath: /api/ready
    buildCommand: cd backend && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: neurosync-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: ALLOW_DEMO_TOKENS
        value: "false"
      - key: MOCK_SSO_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: '["https://neurosync-frontend.onrender.com"]'
      - key: MOCK_LMS_DATABASE_URL
        fromDatabase:
          name: neurosync-lms-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: FRONTEND_URL
        value: https://neurosync-frontend.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.9

  # --- Frontend Static Site ---
  - type: web
    name: neurosync-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: neurosync-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# --- PostgreSQL Database ---
databases:
  - name: neurosync-db
    databaseName: neurosync
    user: neurosync_user
    plan: free
  - name: neurosync-lms-db
    databaseName: neurosync_lms
    user: neurosync_lms_user
    plan: free
